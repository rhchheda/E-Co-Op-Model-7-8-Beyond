<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks | E-Co-Op Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="title">E-Co-Op Tracker</div>
      <div class="subtitle">C-SHINE &middot; KLE Technological University</div>
    </div>
    <nav>
      <a href="index.html">Overview</a>
      <a href="teams.html">Teams</a>
      <a href="tasks.html" class="active">Tasks</a>
      <a href="mentors.html">Mentors</a>
      <a href="resources.html">Resources</a>
    </nav>
    <div class="foot">Data source: Google Sheet<br>See README for setup</div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Task Tracker</h1>
        <p>Program-level activities, owners, due dates, and status.</p>
      </div>
      <div id="data-status">Loading data&hellip;</div>
    </div>

    <div class="card">
      <div class="filters">
        <input type="text" id="search" placeholder="Search task, owner&hellip;">
        <select id="status-filter">
          <option value="">All Statuses</option>
          <option>Pending</option>
          <option>In Progress</option>
          <option>Complete</option>
          <option>Blocked</option>
        </select>
      </div>
      <div id="tasks-table"></div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let ALL_TASKS = [];

function renderTasks() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const status = document.getElementById("status-filter").value;

  const filtered = ALL_TASKS.filter((t) => {
    if (status && (t.status || "").toLowerCase() !== status.toLowerCase()) return false;
    if (q) {
      const hay = [t.activity, t.owner, t.remarks, t.outcomes].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (!filtered.length) {
    document.getElementById("tasks-table").innerHTML = `<div class="empty-state">No tasks match these filters.</div>`;
    return;
  }

  const rows = filtered.map((t) => `
    <tr>
      <td>${escapeHtml(t.sl)}</td>
      <td>
        <strong>${escapeHtml(t.activity)}</strong>
        ${t.details ? `<br><a href="${escapeHtml(t.details)}" target="_blank" rel="noopener">Reference link &rarr;</a>` : ""}
      </td>
      <td>${escapeHtml(t.due)}</td>
      <td>${escapeHtml(t.owner)}</td>
      <td>${badge(t.status)}</td>
      <td>${escapeHtml(t.outcomes)}</td>
      <td style="color:var(--muted);font-size:12.5px;">${escapeHtml(t.remarks)}</td>
    </tr>`).join("");

  document.getElementById("tasks-table").innerHTML = `
    <table>
      <thead><tr><th>#</th><th>Task</th><th>Due</th><th>Owner</th><th>Status</th><th>Outcome</th><th>Remarks</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

(async function () {
  const data = await Data.load();
  setDataStatusEl(Data.getSource());
  ALL_TASKS = data.tasks;

  ["search", "status-filter"].forEach((id) => {
    document.getElementById(id).addEventListener("input", renderTasks);
    document.getElementById(id).addEventListener("change", renderTasks);
  });

  renderTasks();
})();
</script>
</body>
</html>
